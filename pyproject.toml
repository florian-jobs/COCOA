[project]
name = "cocoa-baseline"
version = "0.1.0"
# pandas 1.5.3 doesn't support 3.12
requires-python = ">=3.9,<3.12"
dependencies = [
    # newer pandas returns tuple keys in groupby, breaks enrich()
    "pandas==1.5.3",
    "numpy>=1.23,<2.0",
    "duckdb>=1.0",
    "polars>=1.36.1",
]

[project.scripts]
cocoa-interface = "interface:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["interface.py", "src/**"]
